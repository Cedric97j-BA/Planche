<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <!-- STOPS RESIZING -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planche de Référence</title>
    <style>
        /* == COULEURS (Modifiez ces codes hexadécimaux pour changer le thème) == */
        :root {
            --bg-color: #f0f2f5;      /* Couleur de fond de l'application (Gris clair) */
            --card-bg: #ffffff;       /* Couleur de fond des cartes (Blanc) */
            --primary: #0284c7;       /* Couleur principale (Bleu actuel) */
            --success: #16a34a;       /* Couleur de réussite (Vert) */
            --danger: #dc2626;        /* Couleur de suppression/erreur (Rouge) */
            --warning: #b45309;       /* Texte d'avertissement (Orange foncé) */
            --warning-bg: #fef3c7;    /* Fond d'avertissement (Jaune pâle) */
            --border: #d1d5db;        /* Bordures (Gris) */
        }

        /* BASE STYLES & LAYOUT */
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg-color); margin: 0; padding: 12px; font-size: 16px; }
        #app-container { max-width: 650px; margin: 0 auto; background: var(--card-bg); padding: 16px; border-radius: 8px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary); padding-bottom: 12px; margin-bottom: 16px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        
        /* INPUTS & HIGHLIGHTS */
        input, select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; text-align: center; transition: background-color 0.3s; }
        label { font-size: 0.85rem; font-weight: bold; display: block; margin-bottom: 4px; }
        .highlight-empty { background-color: #fee2e2; border-color: var(--danger); }

        /* PASS CARDS */
        .pass-card { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; overflow: hidden; }
        .pass-header { background: #e5e7eb; padding: 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .btn-delete { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--danger); padding: 0 8px; }
        .points-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0; }
        .avg-bar { text-align: right; font-weight: bold; color: var(--primary); margin-bottom: 12px; }
        .results-bar { display: flex; justify-content: space-between; align-items: center; background: #f3f4f6; padding: 10px; border-radius: 4px; font-weight: bold;}
        select.sd-select { font-weight: bold; background: white; padding: 6px; width: auto; }
        
        /* ALERTS & FINAL BOX */
        #target-alert { display: none; background: var(--warning-bg); color: var(--warning); padding: 12px; border-radius: 6px; margin-top: 16px; text-align: center; font-weight: bold; border: 1px solid #fde68a; }
        #final-result-box { display: none; margin-top: 24px; padding: 16px; border: 3px solid var(--success); border-radius: 8px; background: #f0fdf4; text-align: center; }
        #final-result-box h2 { color: var(--success); margin: 0 0 12px 0; }
        .final-val { font-size: 1.5rem; font-weight: bold; }

        /* BUTTONS */
        .btn { width: 100%; padding: 12px; margin-top: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .btn-add { background: var(--primary); color: white; }
        .btn-pdf { background: var(--success); color: white; display: none; }
        .btn-reset { background: var(--danger); color: white; }

        /* PRINT STYLES (Includes Bug Fix for Placeholders) */
        @media print {
            body { background: white; padding: 0; }
            #app-container { box-shadow: none; max-width: 100%; border: none; }
            .btn, .btn-delete { display: none !important; }
            .pass-card { page-break-inside: avoid; }
            input::placeholder { color: transparent !important; } /* Fix: Hides grey text on PDF */
        }
    </style>

    <!-- PWA Links -->
    <link rel="manifest" href="manifest.json">
        <script>
            if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }   
</script>
</head>
<body>

    <div id="app-container">
        <div class="header">
            <h1 style="margin:0; color:var(--primary);">Planche de référence</h1>
            <div id="logo-container">
                <img src="compactor2.png" alt="Logo" style="height:40px;"> 
            </div>
        </div>

        <div class="grid-2">
            <div><label>Projet</label><input type="text" placeholder="Ex: 0260xxxx - Projet_Planche"></div>
            <div><label>Matériau / Calibre</label><input type="text"></div>
        </div>

        <div id="passes-container"></div>

        <div id="target-alert">🎯 Cible atteinte (< 1%). Veuillez remplir tous les champs du formulaire pour terminer.</div>

        <div id="final-result-box">
            <h2>✅ Planche Complétée</h2>
            <div class="grid-2" style="margin-top:12px;">
                <div><label>MV Sèche Finale</label><div class="final-val"><span id="final-mv">---</span> kg/m³</div></div>
                <div><label>Teneur en eau Finale</label><div class="final-val"><span id="final-w">---</span> %</div></div>
            </div>
        </div>

        <button id="btn-add" class="btn btn-add" onclick="addPass()">➕ Ajouter une ligne</button>
        <button id="btn-pdf" class="btn btn-pdf" onclick="window.print()">📄 Sauvegarder le PDF</button>
        <button class="btn btn-reset" onclick="resetApp()">🗑️ Recommencer l'essai</button>
    </div>

    <template id="pass-template">
        <div class="pass-card">
            <div class="pass-header">
                <div>Nombre de passes (n): <input type="number" class="pass-num trigger" style="width:60px; margin-left:8px;" min="1"></div>
                <button class="btn-delete" onclick="this.closest('.pass-card').remove(); calculateAll();" title="Supprimer">❌</button>
            </div>
            <div class="pass-body">
                <label>Masse volumique sèche (MV) [kg/m³]</label>
                <div class="points-grid">
                    <input type="number" class="trigger den-val" placeholder="Pt A">
                    <input type="number" class="trigger den-val" placeholder="Pt B">
                    <input type="number" class="trigger den-val" placeholder="Pt C">
                </div>
                <div class="avg-bar">Moy: <span class="den-avg">---</span> kg/m³</div>

                <label>Teneur en eau mesurée (w) [%]</label>
                <div class="points-grid">
                    <input type="number" class="trigger hum-val" placeholder="Pt A">
                    <input type="number" class="trigger hum-val" placeholder="Pt B">
                    <input type="number" class="trigger hum-val" placeholder="Pt C">
                </div>
                <div class="avg-bar">Moy: <span class="hum-avg">---</span> %</div>

                <div class="results-bar">
                    <span>ΔMV: <span class="delta-mv" style="color:var(--primary); font-size:1.1rem;">---</span></span>
                    <select class="trigger sd-select">
                        <option value="">S ou D</option>
                        <option value="S">S (Statique)</option>
                        <option value="D">D (Dynamique)</option>
                    </select>
                </div>
            </div>
        </div>
    </template>

    <script>
        const container = document.getElementById('passes-container');
        const template = document.getElementById('pass-template');
        const finalBox = document.getElementById('final-result-box');
        const targetAlert = document.getElementById('target-alert');
        const btnAdd = document.getElementById('btn-add');
        const btnPdf = document.getElementById('btn-pdf');

        addPass(); addPass();

        function addPass() {
            const clone = template.content.cloneNode(true);
            clone.querySelectorAll('.trigger').forEach(input => input.addEventListener('input', calculateAll));
            container.appendChild(clone);
            calculateAll();
        }

        function resetApp() {
            if(confirm("Effacer toutes les données ?")) {
                container.innerHTML = '';
                document.querySelectorAll('input[type="text"]').forEach(i => i.value = '');
                addPass(); addPass();
            }
        }

        function calculateAll() {
            const cards = document.querySelectorAll('.pass-card');
            let prevMv = null, stableGaps = 0, allFormsFilled = true;
            const validPasses = []; 
            
            finalBox.style.display = targetAlert.style.display = btnPdf.style.display = 'none';
            btnAdd.style.display = 'block';

            cards.forEach((card, i) => {
                let mvAvg = getStrictAverageAndHighlight(Array.from(card.querySelectorAll('.den-val')));
                let humAvg = getStrictAverageAndHighlight(Array.from(card.querySelectorAll('.hum-val')));

                if (mvAvg !== null) {
                    mvAvg = Math.round(mvAvg);
                    validPasses.push({ mv: mvAvg, hum: humAvg });
                }
                
                card.querySelector('.den-avg').textContent = mvAvg !== null ? mvAvg : '---';
                card.querySelector('.hum-avg').textContent = humAvg !== null ? humAvg.toFixed(1) : '---';

                if (mvAvg === null || humAvg === null || !card.querySelector('.pass-num').value || !card.querySelector('.sd-select').value) {
                    allFormsFilled = false;
                }

                let deltaDisp = card.querySelector('.delta-mv');
                if (i === 0) {
                    deltaDisp.textContent = 'N/A';
                } else if (prevMv !== null && mvAvg !== null && prevMv !== 0) {
                    let delta = Math.abs(((mvAvg - prevMv) / prevMv) * 100);
                    deltaDisp.textContent = delta.toFixed(2) + '%';
                    stableGaps = delta < 1.0 ? stableGaps + 1 : 0;
                } else {
                    deltaDisp.textContent = '---';
                }

                if (mvAvg !== null) prevMv = mvAvg;
            });

            if (stableGaps >= 2) {
                btnAdd.style.display = 'none';
                if (allFormsFilled && validPasses.length >= 2) {
                    finalBox.style.display = btnPdf.style.display = 'block';
                    const [prev, last] = [validPasses[validPasses.length - 2], validPasses[validPasses.length - 1]];
                    const isLastHigher = last.mv >= prev.mv;
                    document.getElementById('final-mv').textContent = isLastHigher ? last.mv : prev.mv;
                    document.getElementById('final-w').textContent = (isLastHigher ? last.hum : prev.hum).toFixed(1);
                } else {
                    targetAlert.style.display = 'block';
                }
            }
        }

        function getStrictAverageAndHighlight(inputs) {
            let sum = 0, count = 0;
            inputs.forEach(i => { if (i.value !== '') { sum += parseFloat(i.value); count++; } });
            inputs.forEach(i => i.classList.toggle('highlight-empty', count > 0 && count < 3 && i.value === ''));
            return count === 3 ? (sum / 3) : null; 
        }
    </script>
</body>
</html>
